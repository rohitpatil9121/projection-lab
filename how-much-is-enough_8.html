<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>How much is enough</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  /* ===== THE IVORY SYSTEM =====
     The house brand, applied whole. docs/BRAND.md is the source of truth; this block is
     only its machine-readable form. Three laws are load-bearing here:

       THE PAGE IS IVORY, NEVER WHITE. White glares under long reading and reads as
       "designed"; ivory reads as paper. White is a component colour — cards only.

       TURQUOISE IS RATIONED. It appears only on an answer or an action: the save button,
       the slider, the active tab, and the one line on the chart that IS the answer —
       "enough to retire then". Nowhere else. Rationing it is what makes it mean something.

       GREY IS METADATA ONLY. Any line meant to be READ gets body colour. Pages feel dull
       because they set real sentences in grey; --mut is for timestamps and labels.

     Dark is the disclosure band grown to fill the screen: navy, not black, not grey. On
     navy the deep teal goes muddy, so turquoise switches to its bright cut.

     The chart is the one place more than one hue is allowed, because a line has to be told
     apart from another line. The series hues are fixed and carry across both grounds; only
     their VALUES are tuned per ground, so both meet AA. */
  :root{
    /* ivory ground — the default */
    --bg:#F6F3EC;--studio:#F6F3EC;--card:#FFFFFF;--card2:#FFFFFF;--surf1:#FFFFFF;--surf2:#FFFFFF;
    --line:#E7E0D6;--line2:#D6CCBE;
    --ink:#0B2545;--ink2:#39434F;--mut:#5A6470;
    --em:#0B6E6D;--em2:#0B6E6D;--on-em:#FFFFFF;
    /* goal series — teal, violet, blue, gold, amber, dropped in value to hold on paper */
    --series-1:#0F8F82;--series-2:#5647B8;--series-3:#2A63C4;--series-4:#8A6410;--series-5:#B05A12;
    --violet:#5647B8;--amber:#7E5210;--red:#9A3B2A;
    /* the three chart lines, same hues as they always were */
    --c-worst:#B57511;--c-mid:#2A63C4;--c-best:#10874F;--c-enough:#0B6E6D;--c-worst-ink:#7E5210;
    --t-hero:28px;--t-num:20px;--t-title:16px;--t-row:14px;--t-body:12px;--t-meta:10px;
    /* THREE LINE-HEIGHTS. There were ten, between 1.0 and 1.9, chosen one element at a
       time. Numbers and headings set tight, interface text at 1.5, prose you actually read
       at 1.65. Nothing else. */
    --lh-tight:1.25;--lh-ui:1.5;--lh-read:1.65;
    --s-1:2px;--s-2:4px;--s-3:8px;--s-4:12px;--s-5:16px;--s-6:20px;--s-7:24px;--s-8:40px;
    --field:#F6F3EC;--track:#D6CCBE;--grid:#EFEAE1;--axis:#D6CCBE;
    --info:#BFDDDB;--info-bg:#E4F1F0;--info-ink:#0B4F4E;
    --warn:#E0C79A;--warn-bg:rgba(181,117,17,.10);
    --stop:#C98F80;--stop-bg:rgba(154,59,42,.09);
    --scrim:rgba(11,37,69,.38);--fade0:rgba(246,243,236,0);--fade1:rgba(246,243,236,.92);
    --bandfill:rgba(11,37,69,.03);--focus:rgba(11,110,109,.38);
    --r-s:12px;--r-m:16px;--r-l:20px;--r-xl:28px;--e-emph:cubic-bezier(.2,0,0,1);--e-dec:cubic-bezier(.05,.7,.1,1);--e-std:cubic-bezier(.3,0,.2,1);
    --sh1:0 1px 2px rgba(61,50,30,.05),0 6px 16px rgba(61,50,30,.04);--sh2:0 10px 26px -12px rgba(61,50,30,.22);
    --page:radial-gradient(900px 560px at 18% -10%,#FBF9F4 0%,rgba(251,249,244,0) 55%),radial-gradient(760px 520px at 106% 2%,#F1ECE1 0%,rgba(241,236,225,0) 50%),#EFEAE1;
    --screen:linear-gradient(180deg,#FBF9F4,#F6F3EC);--screen-solid:#F6F3EC;}

  /* the disclosure band, grown to fill the screen */
  :root[data-theme="dark"]{
    --bg:#0B2545;--studio:#0E2B50;--card:#12345E;--card2:#17406F;--surf1:#0E2B50;--surf2:#12345E;
    --line:#1D446F;--line2:#2C5786;
    --ink:#F3F6F8;--ink2:#C6D6E4;--mut:#9FB6CC;
    --em:#6FD6D2;--em2:#6FD6D2;--on-em:#07203D;
    --series-1:#2DD4BF;--series-2:#9B8CFA;--series-3:#5B9DF9;--series-4:#E8B54D;--series-5:#F0A93B;
    --violet:#9B8CFA;--amber:#F0A93B;--red:#E8877A;
    --c-worst:#F0A93B;--c-mid:#5B9DF9;--c-best:#3DDC97;--c-enough:#6FD6D2;--c-worst-ink:#F0A93B;
    --field:#092040;--track:#2C5786;--grid:#173A63;--axis:#2C5786;
    --info:#2C5786;--info-bg:rgba(111,214,210,.10);--info-ink:#9FE3E0;
    --warn:#6E5426;--warn-bg:rgba(240,169,59,.12);
    --stop:#8A4536;--stop-bg:rgba(232,135,122,.14);
    --scrim:rgba(4,14,28,.66);--fade0:rgba(11,37,69,0);--fade1:rgba(11,37,69,.92);
    --bandfill:rgba(255,255,255,.035);--focus:rgba(111,214,210,.42);
    --sh1:0 1px 2px rgba(0,0,0,.30);--sh2:0 10px 26px -12px rgba(0,0,0,.60);
    --page:radial-gradient(900px 560px at 18% -10%,#12345E 0%,rgba(18,52,94,0) 55%),radial-gradient(760px 520px at 106% 2%,#0E2B50 0%,rgba(14,43,80,0) 50%),var(--bg);
    --screen:linear-gradient(180deg,#0E2B50,#0B2545);--screen-solid:#0B2545;}
  *{box-sizing:border-box}
  /* THE WHOLE PAGE IS THE PHONE.
     Galaxy S24 Ultra, 1440 × 3120. On a phone it fills the screen; on a desktop it is the
     same shape, sized to the window height and centred, never stretched. Nothing around it. */
  html,body{height:100%}
  body{margin:0;background:var(--page);color:var(--ink);font-family:'Inter',system-ui,sans-serif;line-height:var(--lh-ui);-webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center;padding:0;overflow:hidden}
  /* THE EVIDENCE IS MONOSPACED. Every figure, fee and label. It makes a number look
     weighed rather than written, and it is the detail that makes the brand recognisable. */
  .num{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  /* No device chrome. This is the app, not a picture of the app on a phone. */
  .phone{position:relative;aspect-ratio:1440/3120;
    width:min(100vw, calc(100vh * 1440 / 3120));
    width:min(100vw, calc(100dvh * 1440 / 3120));}
  .screen{background:var(--screen);border:0;border-radius:0;overflow:hidden;height:100%;display:flex;flex-direction:column;position:relative}
  .body{flex:1;overflow-y:auto;padding:var(--s-3) var(--s-5) var(--s-6);scrollbar-width:none}.body::-webkit-scrollbar{display:none}
  /* THE APP SAYS WHAT IT IS. There was no title anywhere in the document — someone opening a
     link met a banner about a made-up person and two very large rupee figures, with nothing
     saying what the thing was, who built it, or where the number came from. One block, outside
     the body, so it survives every tab change and costs one row of height. */
  .apphead{flex:0 0 auto;padding:var(--s-5) var(--s-5) var(--s-4);border-bottom:1px solid var(--line);background:var(--surf1)}
  .appname{font-size:var(--t-row);font-weight:700;letter-spacing:-.01em;color:var(--ink)}
  .appsub{font-size:var(--t-body);line-height:var(--lh-ui);color:var(--mut);margin-top:2px}
  .tabbar{flex:0 0 auto;height:62px;background:var(--surf1);border-top:1px solid var(--line);display:flex;padding:var(--s-3) var(--s-3) var(--s-3)}
  .tabbar button{flex:1;min-width:0;background:none;border:none;color:var(--mut);font-family:inherit;font-size:var(--t-body);font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--s-2);transition:color .15s var(--e-std)}
  .tabbar button.on{color:var(--em)}
  .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:var(--t-meta);letter-spacing:.1em;text-transform:uppercase;color:var(--mut);font-weight:500}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-l);padding:var(--s-5);position:relative;overflow:hidden;box-shadow:var(--sh1)}
  .row{display:flex;align-items:center;justify-content:space-between}
  .muted{color:var(--mut)}.ink2{color:var(--ink2)}
  .item{display:flex;align-items:center;gap:var(--s-4);padding:var(--s-4) 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:none}.item .m{flex:1;min-width:0;cursor:pointer}
  /* 6px is the optical offset from the top of a 14px/1.5 line to the middle of a 9px chip.
     It is a half-step on purpose: the grid positions blocks, the eye aligns marks. */
  .item--multi{align-items:flex-start}
  .item--multi > .dot{margin-top:6px}
  .item--multi > .sw{align-self:center}
  /* A row that navigates gets the four states a button gets. The chevron moves 2px on
     hover — the smallest possible signal that the row leads somewhere. */
  .item--go{margin:0 calc(-1 * var(--s-4));padding-left:var(--s-4);padding-right:var(--s-4);border-radius:var(--r-s);
    transition:background .15s var(--e-std)}
  .item--go:hover{background:var(--field)}
  .item--go:hover .chev{transform:translateX(2px)}
  .item--go:active{transform:scale(.995)}
  .item--go:focus-visible{outline:none;box-shadow:0 0 0 3px var(--focus)}
  .chev{color:var(--mut);font-size:var(--t-title);transition:transform .15s var(--e-std)}
  /* TWO CARDS, ONE FACT EACH. They collapse to one column below 340px rather than
     letting a rupee figure wrap mid-number. */
  .duo{display:grid;grid-template-columns:1fr 1fr;gap:var(--s-4)}
  @media (max-width:339px){.duo{grid-template-columns:1fr}}
  .duo .card{padding:var(--s-5);cursor:pointer;transition:border-color .15s var(--e-std),transform .1s var(--e-std)}
  .duo .card:active{transform:scale(.985)}
  .duo .card:focus-visible{outline:2px solid var(--em);outline-offset:2px}
  .duo .dv{font-size:var(--t-num);font-weight:600;line-height:var(--lh-tight);margin-top:var(--s-3);letter-spacing:-.01em}
  .duo .ds{font-size:var(--t-body);line-height:var(--lh-ui);color:var(--mut);margin-top:var(--s-2)}
  /* ONE BUTTON. Five variants, one base, and the two states it never had: a press, because
     that is the only affordance a phone gives back, and a visible focus ring, because a
     keyboard could tab through forty-five of these and see nothing move. */
  .btn{font-family:inherit;font-weight:700;font-size:var(--t-row);border:1px solid transparent;
    border-radius:var(--r-m);cursor:pointer;min-height:44px;padding:var(--s-4) var(--s-5);
    transition:background .15s var(--e-std),border-color .15s var(--e-std),color .15s var(--e-std),transform .08s var(--e-std)}
  .btn:active,.askbar button:active,.tabbar button:active,.ibtn:active,.seg:active{transform:scale(.985)}
  .btn:focus-visible,.askbar button:focus-visible,.tabbar button:focus-visible,.ibtn:focus-visible,.sw:focus-visible{outline:none;box-shadow:0 0 0 3px var(--focus)}
  .btn--save{background:var(--em);color:var(--on-em)}
  .btn--danger{background:transparent;border-color:var(--red);color:var(--red)}
  .btn--add{width:100%;margin-top:var(--s-4);background:transparent;border:1px dashed var(--line2);color:var(--ink2);font-weight:700;font-size:var(--t-body);padding:var(--s-4)}
  .btn--add:hover{border-color:var(--em);color:var(--em)}
  .btn--mini{flex:1;min-width:112px;background:var(--field);border-color:var(--line2);color:var(--ink);font-size:var(--t-body);font-weight:700;border-radius:var(--r-s);padding:var(--s-3) var(--s-4)}
  .btn--ghost{background:transparent;border-color:var(--line2);color:var(--ink)}
  .btn--mini.btn--danger{background:var(--field);border-color:var(--stop);color:var(--red)}
  .btn--link{display:block;width:100%;margin-top:var(--s-6);padding:0;background:none;border:none;border-radius:0;color:var(--ink2);font-size:var(--t-body);font-weight:600;text-decoration:underline;text-underline-offset:3px}
  .field{margin-bottom:var(--s-4)}.field label{font-size:var(--t-body);color:var(--ink2);font-weight:600;display:flex;align-items:center;gap:var(--s-3);margin-bottom:var(--s-3)}
  .field label span{flex:1;min-width:0}
  .fnote{display:none;font-size:var(--t-body);line-height:var(--lh-ui);color:var(--ink2);background:var(--field);border:1px solid var(--line);border-radius:var(--r-s);padding:var(--s-4) var(--s-4);margin:var(--s-3) 0 0}
  .fnote.on{display:block}
  .nudge.samp{display:flex;gap:var(--s-4);align-items:center;margin:var(--s-3) 0 var(--s-2)}
    .qbub{background:var(--em);color:var(--on-em);font-size:var(--t-body);font-weight:600;line-height:var(--lh-ui);padding:var(--s-4);border-radius:var(--r-m) var(--r-m) 4px var(--r-m);margin:var(--s-3) 0 var(--s-3) auto;max-width:82%;width:fit-content}
  .abub{margin:var(--s-3) auto var(--s-5) 0;max-width:96%}
  .abub>.ink2,.abub>div>.ink2{background:var(--card);border:1px solid var(--line);border-radius:var(--r-m) var(--r-m) var(--r-m) 4px;padding:var(--s-4)}
  .askinput{flex:1;min-width:0;background:var(--field);border:1px solid var(--line2);border-radius:var(--r-s);color:var(--ink);font-family:inherit;font-size:var(--t-title);padding:var(--s-4);min-height:44px}
  .askinput:focus{outline:none;border-color:var(--em);box-shadow:0 0 0 3px var(--focus)}
  .agein{width:64px;background:var(--field);border:1px solid var(--line2);border-radius:var(--r-s);color:var(--ink);font-family:inherit;font-size:var(--t-title);font-weight:700;text-align:center;padding:var(--s-3) var(--s-2);min-height:44px}
  .agein:focus{outline:none;border-color:var(--em);box-shadow:0 0 0 3px var(--focus)}
    .step{width:20px;height:20px;border-radius:50%;background:var(--line2);color:var(--ink);font-size:var(--t-meta);font-weight:700;display:flex;align-items:center;justify-content:center;flex:0 0 auto;font-family:'IBM Plex Mono',monospace}
  /* THE ONE ACCENT ON THE PLAN TAB. A thin rule beside a row that is still empty and still
     required. It is drawn at most once or twice, which is the only reason it reads at all —
     an accent on every row is a texture, not a signal. A pseudo-element rather than a border
     or an inset shadow, so it survives the focus ring and does not move the padding. */
  .item--flag{position:relative}
  .item--flag::before{content:'';position:absolute;left:2px;top:10px;bottom:10px;width:3px;border-radius:2px;background:var(--em)}
  /* The two pages are different heights. Without this the container takes the taller of
     them and leaves a hole under the chart. */
  #c_pager{overflow:hidden;margin:var(--s-3) calc(-1 * var(--s-5)) 0;touch-action:pan-y;transition:height .3s cubic-bezier(.22,.61,.36,1)}
  #c_track{display:flex;width:200%;transition:transform .3s cubic-bezier(.22,.61,.36,1);align-items:flex-start}
  #c_track>div{width:50%;flex:0 0 50%}
  /* THE ANCHOR. A status strip, not a card — no border and no shadow, because it is not an
     object you act on, it is a fact that is always true. Tinted so it reads as a different kind
     of thing from the panel under it. */
  .anch{background:var(--field);border-radius:var(--r-s);padding:var(--s-4) var(--s-5);margin-top:var(--s-4);cursor:pointer}
  .anch:active{transform:scale(.995)}
  .anch:focus-visible{outline:none;box-shadow:0 0 0 3px var(--focus)}
  .anch-e{font-size:var(--t-meta);font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
  .anch-b{font-size:var(--t-body);line-height:var(--lh-ui);color:var(--ink2);margin-top:var(--s-2)}
  /* THE SCENARIO PANEL. One panel is one complete answer: an ending in the accent colour, then
     the figures behind it in a fixed order so the same row can be compared between panels. */
  .pnl{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);
    border-radius:var(--r-m);padding:var(--s-5);margin-top:var(--s-4);box-shadow:var(--sh1);
    cursor:pointer;transition:border-color .15s var(--e-std),transform .1s var(--e-std)}
  .pnl:active{transform:scale(.995)}
  .pnl:focus-visible{outline:none;box-shadow:0 0 0 3px var(--focus)}
  .pnl-h{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s-3)}
  .pnl-t{font-size:var(--t-meta);font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2)}
  .pnl-w{font-size:var(--t-meta);letter-spacing:.06em;text-transform:uppercase;color:var(--mut);white-space:nowrap}
  .pnl-out{font-size:var(--t-num);font-weight:700;line-height:var(--lh-tight);margin-top:var(--s-4);color:var(--ink)}
  .pnl-os{font-size:var(--t-body);line-height:var(--lh-ui);color:var(--mut);margin-top:var(--s-2)}
  .pnl-rows{margin-top:var(--s-5);padding-top:var(--s-4);border-top:1px solid var(--line)}
  .prow2{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s-4);padding:var(--s-2) 0}
  .plab2{font-size:var(--t-body);color:var(--mut)}
  .pval2{font-size:var(--t-row);font-weight:500;color:var(--ink);text-align:right}
  .pnl-more{font-size:var(--t-body);color:var(--em);margin-top:var(--s-4);display:flex;align-items:center;gap:var(--s-2)}
  /* TWO PAGES, ONE SMALL CONTROL. Two 44px dots cost more vertical space than they were
     worth and said nothing about what the second page holds. A named segment does both. */
  #c_dots{display:flex;gap:var(--s-1);justify-content:center;margin-top:var(--s-3);background:var(--field);border:1px solid var(--line);border-radius:var(--r-s);padding:2px;width:max-content;margin-left:auto;margin-right:auto}
  .seg{border:none;background:transparent;font-family:inherit;font-size:var(--t-meta);font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--mut);padding:0 var(--s-5);height:30px;border-radius:calc(var(--r-s) - 2px);cursor:pointer}
  .seg.on{background:var(--card);color:var(--ink);box-shadow:var(--sh1)}
  .seg:focus-visible{outline:none;box-shadow:0 0 0 3px var(--focus)}
  /* THE SLIDER IS THE CHART. A strip across the foot of the drawing, invisible because the
     pill and the dashed line already say where it is and what it does. Its ends are set in JS
     from the same padding the SVG used, so the pill cannot drift off its own line. */
  #c_chart{position:relative}
  #c_slbox{position:absolute;left:0;right:0;bottom:0;height:46px}
  .rngchart{-webkit-appearance:none;appearance:none;position:absolute;left:0;right:0;bottom:0;width:100%;height:46px;background:transparent;cursor:ew-resize;margin:0;touch-action:none}
  .rngchart::-webkit-slider-runnable-track{height:46px;background:transparent}
  .rngchart::-webkit-slider-thumb{-webkit-appearance:none;width:36px;height:46px;background:transparent;border:none}
  .rngchart::-moz-range-track{height:46px;background:transparent}
  .rngchart::-moz-range-thumb{width:36px;height:46px;background:transparent;border:none}
  .rngchart:focus-visible{outline:none}
  .rngchart:focus-visible+#c_pill{box-shadow:0 0 0 3px var(--focus)}
  /* pointer-events off on the body so a drag that starts on the pill still reaches the input;
     only the two arrows take taps of their own. */
  /* TWO LINES, LIKE A STEPPER OVER A CAPTION. One line put the word RETIREMENT beside the
     arrows and made the pill about 150px wide, so near either end of the axis half of it hung
     outside the chart — and the chart sits inside an overflow:hidden pager, so it was cut off
     rather than merely overhanging. */
  #c_pill{position:absolute;bottom:2px;pointer-events:none;
    display:flex;flex-direction:column;align-items:center;background:var(--card);border:1px solid var(--line2);
    border-radius:var(--r-s);box-shadow:var(--sh2);padding:2px var(--s-3) var(--s-2);white-space:nowrap}
  #c_pill .prow{display:flex;align-items:center;gap:var(--s-2)}
  #c_pill .pval{font-size:var(--t-row);font-weight:700;color:var(--ink);min-width:24px;text-align:center}
  #c_pill .plab{font-size:var(--t-meta);color:var(--mut);letter-spacing:.08em;text-transform:uppercase;line-height:1;margin-top:1px}
  .pnud{pointer-events:auto;border:none;background:transparent;color:var(--ink2);font-size:11px;line-height:1;
    width:28px;height:28px;border-radius:var(--r-s);cursor:pointer;padding:0}
  .pnud:active{background:var(--field)}
  .pnud:focus-visible{outline:none;box-shadow:0 0 0 3px var(--focus)}
  .ibtn.s{width:22px;height:22px;font-size:var(--t-body)}
  .field input,.field select{width:100%;background:var(--field);border:1px solid var(--line2);border-radius:var(--r-s);color:var(--ink);font-family:inherit;font-size:var(--t-title);padding:var(--s-4) var(--s-4);font-variant-numeric:tabular-nums}
  .field input:focus,.field select:focus{outline:none;border-color:var(--em);box-shadow:0 0 0 3px var(--focus)}
  .recho{font-size:var(--t-body);color:var(--ink2);margin-top:var(--s-3);min-height:15px;line-height:var(--lh-tight)}
  .f2{display:flex;gap:var(--s-4)}.f2>div{flex:1}

<body>
  <div class="phone"><div class="screen">
    <header class="apphead">
      <div class="appname">How much is enough</div>
      <div class="appsub">Your FIRE number, tested against 31 real NIFTY 500 sequences.</div>
    </header>
    <div class="body" id="body"></div>
    <div class="tabbar">
      <button id="tab_ask" onclick="go('ask')">What if</button>
      <button id="tab_num" onclick="go('num')">FIRE number</button>
      <button id="tab_life" class="on" onclick="go('life')">Your plan</button>
    </div>
    <div id="askbar" class="askbar" style="display:none"></div>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Details"><div class="sheetin" id="sheetin" tabindex="-1"></div></div>
  </div></div>
<script>
(function(){
  /* ============================================================================
     THE KEY. Two ways to give the Ask tab a model, and only one of them is safe to
     share.

     ASK_PROXY (further down) — your own endpoint holding the key. This is the one to
     use for anybody but you. The file can be published; the key cannot be read from
     it; and the limits are enforced somewhere a visitor cannot switch off.

     MY_KEY (below) — for a copy that never leaves your machine. A key written here is
     readable by everyone you send the file to, with one look at the source, and there
     is nothing this app can do about it: whoever takes it will not use the app, they
     will point their own requests at the provider and you will get the invoice. Ship
     the empty version.
     ============================================================================ */
  const MY_KEY='';

  const NOW=new Date().getFullYear(), NOWM=new Date().getMonth()+1;
  const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  /* ===== RETURN SERIES — identical source and method to the main app ===== */
  const RETURNS={meta:{series:'NIFTY 500 Total Returns Index — calendar-year returns (%)',
    source:'NSE Indices — niftyindices.com › Reports › Historical Data › Total Returns Index Values.',
    method:'Last trading day of December, year on year, computed in code. Never hand-typed.',
    attribution:'NIFTY and NIFTY 500 are trademarks of NSE Indices Limited. This app is not affiliated with, endorsed by, sponsored by or connected to NSE Indices Limited or the National Stock Exchange of India. We do not republish their data. This app only carries yearly percentages that we calculated from it. Any error in how we used their numbers is ours.',
    note:'A genuine total-return series: dividends are already in it.'},
    startYear:1995,
    r:[-34.35,-5.95,14.50,-6.84,100.92,-23.45,-21.55,13.92,104.85,21.07,38.77,36.16,64.58,-56.54,90.96,15.27,-26.40,33.48,4.82,39.30,0.22,5.12,37.65,-2.14,8.97,17.89,31.60,4.25,26.91,16.24,7.76]};
  const EQ=RETURNS.r.map(x=>x/100), NEQ=EQ.length;

  const CLSN={equity:'Equity',debt:'Debt & cash',commodity:'Gold',realestate:'Real estate',digital:'Others'};
  const CLSC={equity:'var(--series-2)',debt:'var(--c-mid)',commodity:'var(--series-5)',realestate:'var(--violet)',digital:'var(--ink2)'};
  /* Published defaults. Every one of these is editable, and the reasoning sits behind the i,
     because an assumption that moves the answer and cannot be seen is poison in a tool whose
     entire product is "trust me". Equity has no default here — it is replayed against history. */
  const DEFRET={debt:6.5,commodity:8,realestate:7,digital:8};

  const S={
    dob:'1988-06', retireAge:55, planAge:90,
    inflation:6,
    spendMo:1.5,
    /* THE EXAMPLE PLAN FILLS EVERY INPUT.
       A half-filled example teaches the app badly: the goal list is empty, so nobody learns
       that goals exist; nothing is held, so the FI date, the earliest age and the whole
       arrival comparison are absent; no legacy, so that row reads "Nothing". A first-time
       visitor was being shown the skeleton and asked to imagine the rest.
       These are one invented person's figures, and the banner says so on every screen. */
    goals:[
      {id:1,n:"Daughter's college",amt:40,date:'2034-06',type:'one',infl:10,on:true},
      {id:2,n:'A month away every year',amt:5,date:'2045-01',end:'2057-01',type:'recur',infl:6,on:true}
    ],
    bequest:{on:true,amt:200},
    haveNow:180, saveMo:0.75,   // both optional in a real plan; the example fills them so the FI date exists
    /* Nobody saves the same rupee amount at 30 and at 50. Income rises, and what goes
       away every month rises with it. A level contribution understates what a working
       person will actually manage, so it overstates what they must start with. This is
       the yearly step-up, applied to the monthly amount at every anniversary. */
    stepUp:6,
    /* THE PLAN ON SCREEN IS AN EXAMPLE UNTIL THE USER TOUCHES IT.
       It carries an example split so a first-time visitor can see what the app does. The
       moment they change anything the plan becomes theirs, and the split empties — because
       a default mix is a recommendation, and this app does not make recommendations. */
    /* TAX ON SELLING.
       Every rupee spent in retirement is a rupee sold, and in India a long-term equity gain
       is taxed. Modelling it exactly needs cost-basis tracking per lot, which this app has
       no way to know. So one honest approximation, stated on screen and editable: a share
       of each withdrawal is gain, and that share is taxed. A rough figure that exists beats
       a precise figure that pretends tax does not. */
    taxRate:12.5, taxGain:60,
    pause:null,   // preview-only: a break from work, set by Ask, never saved
    /* HOW THE MONEY IS TAKEN OUT. 'rebalance' is the default because it is the closer of the two
       to what the app has always done, so an existing plan does not change strategy underneath
       its owner. */
    drawdown:'rebalance',
    sample:true,
    mix:{equity:60,debt:30,commodity:10,realestate:0,digital:0},
    ret:Object.assign({},DEFRET)
  };
  let GID=0;

  const yrOf=d=>+((''+d).slice(0,4));const moOf=d=>+((''+d).slice(5,7))||1;
  const mLabel=d=>MONTHS[moOf(d)-1]+' '+yrOf(d);
  const age0=()=>Math.max(0,Math.floor(((NOW*12+NOWM)-(yrOf(S.dob)*12+moOf(S.dob)))/12));
  const retYear=()=>NOW+(S.retireAge-age0());
  const endYear=()=>NOW+(S.planAge-age0());
  function money(l){l=+l||0;const neg=l<0;l=Math.abs(l);let s;
    if(l>=100)s='₹'+(+(l/100).toFixed(2))+' Cr';else if(l>=1)s='₹'+(+l.toFixed(2))+' L';else s='₹'+Math.round(l*1e5).toLocaleString('en-IN');
    return (neg?'-':'')+s;}
  const moneyMo=l=>money(l)+'/mo';
  const mixTotal=()=>Object.keys(CLSN).reduce((s,k)=>s+(+S.mix[k]||0),0);
  const w=k=>(+S.mix[k]||0)/Math.max(1,mixTotal());
  const mixSet=()=>mixTotal()>0;
  /* To spend ₹100 you must sell more than ₹100. This is that multiplier. */
  /* Long-run compound rate of the equity series, computed, never typed. */
  const eqCAGR=()=>{let p=1;EQ.forEach(r=>p*=(1+r));return (Math.pow(p,1/NEQ)-1)*100;};
  const inflationBeatsEverything=()=>{
    const rates=[eqCAGR()];
    Object.keys(CLSN).forEach(k=>{if(k!=='equity'&&(+S.mix[k]||0)>0)rates.push(+S.ret[k]||0);});
    if((+S.mix.equity||0)<=0)rates.shift();
    return rates.length?S.inflation>Math.max(...rates):false;};
  const grossUp=()=>{const d=(+S.taxRate||0)/100*((+S.taxGain||0)/100);
    return d>0&&d<0.95?1/(1-d):1;};
  /* Called by every editor. Once, on the first edit of the session. */
  /* THE SPLIT STILL EMPTIES ON THE FIRST EDIT — a pre-filled allocation is a recommendation,
     and this app does not make them. What changes is when the user finds out. It used to be
     silent: they edited their spending, opened the answer, and met a wall. The engine cannot
     run without a split, so the moment the example's split is dropped we ask for the real one,
     there and then. The answer is gone for one sheet, not for a tab change and a hunt. */
  let MIXASK=false;
  function unsample(keepMix){
    if(!S.sample)return;
    S.sample=false;
    if(!keepMix){S.mix={equity:0,debt:0,commodity:0,realestate:0,digital:0};MIXASK=true;}}
  // blended rate used ONLY for proportions and the from-zero saving figure, never for the headline
  const disc=y=>Math.pow(1+S.inflation/100,y-NOW);

  /* =========================================================================
     ENGINE — the same method as the main app, pointed at a different unknown.
     There we fix the corpus and report the outcome. Here we fix the outcome —
     the money must last to plan age and leave the bequest — and solve for the
     corpus. One capability, two directions.

     No Monte Carlo. One run per starting year, replayed in the real order,
     wrapping when the plan outlives the series.

     The money is held at the target mix the user set, and rebalanced back to it
     every year. That is not a recommendation: it is the only assumption
     consistent with them having told us that is the mix they intend to hold.
     ========================================================================= */
  function goalsDueIn(yr){
    let due=0;
    for(const g of S.goals){
      if(g.on===false)continue;
      const gy=yrOf(g.date), inf=Math.pow(1+(+g.infl||0)/100, yr-NOW);
      if(g.type==='recur'){const ge=yrOf(g.end||g.date); if(yr>=gy&&yr<=ge)due+=g.amt*inf;}
      else if(yr===gy)due+=g.amt*inf;
    }
    return due;
  }
  // one life, starting with nominal corpus C at the retirement year, history index st.
  /* ═══════════════════════════════════════════════════════════════════════════════════════
     HOW THE MONEY IS TAKEN OUT

     Until now there was one pot growing at the weighted target rate, which is arithmetically
     the same as a portfolio held exactly at target every single year — rebalanced continuously,
     free of cost and free of tax, and every withdrawal taken pro-rata. That is a fine
     simplification and it is also a strategy nobody actually runs.

     So the pot becomes five balances, each growing at its own rate, and the strategy decides
     which one is sold. Nothing rebalances on its own in either mode: the only thing that moves
     money between assets is a cash flow.

       REBALANCE AT WITHDRAWAL — spending is funded by selling whatever is above its target
       weight, in proportion to how far above it is. In a year equity has run up you spend
       equity; after a crash equity is below target so you spend debt instead, and the act of
       spending pulls the portfolio back toward target with no trade of its own. Money going IN
       does the mirror image: a contribution buys whatever is furthest below target.

       WATERFALL — spending drains the assets in a fixed order, safest first, and equity is
       touched only when everything else is gone. Nothing is rebalanced ever, so the mix drifts
       steadily toward equity as the years pass. That drift is the strategy, not a side effect.

     WHAT THE TAX MODEL STILL CANNOT SEE, AND IT MATTERS MORE HERE THAN ANYWHERE ELSE. There is
     one gross-up rate for every rupee withdrawn, whatever was sold to raise it. Waterfall sells
     debt first and debt is taxed harder than equity, so the comparison charges waterfall too
     little. The screen says so. Until per-asset rates exist, read a waterfall advantage as an
     upper bound rather than as a figure.
     ═══════════════════════════════════════════════════════════════════════════════════════ */
  const WF_ORDER=['debt','commodity','realestate','digital','equity'];
  const isWaterfall=()=>S.drawdown==='waterfall';
  const splitAtTarget=(tot)=>{const b={};for(const k of Object.keys(CLSN))b[k]=(+tot||0)*w(k);return b;};
  const balTotal=(b)=>{let t=0;for(const k in b)t+=b[k];return t;};

  /* Take `need` out of the balances and return what could not be raised. Mutates b. */
  function takeOut(b,need){
    if(need<=0)return 0;
    const tot=balTotal(b);
    if(need>=tot){for(const k in b)b[k]=0;return need-tot;}
    if(isWaterfall()){
      /* Safest first. When one is emptied the remainder comes from the next, which is why a bad
         year can still reach equity — it just takes everything else being gone first. */
      let left=need;
      for(const k of WF_ORDER){
        if(left<=0)break;
        const take=Math.min(b[k]||0,left);b[k]-=take;left-=take;}
      return left>1e-9?left:0;}
    /* Sell what is overweight, in proportion to how overweight it is. The differences from the
       post-withdrawal target sum to exactly `need`, so scaling the positive ones to `need`
       never buys anything and never sells an underweight asset. */
    const after=tot-need, pos={};let sum=0;
    for(const k in b){const d=b[k]-w(k)*after;if(d>0){pos[k]=d;sum+=d;}}
    if(sum<=0){for(const k in b)b[k]-=b[k]/tot*need;return 0;}
    const f=need/sum;
    for(const k in pos)b[k]=Math.max(0,b[k]-pos[k]*f);
    return 0;}

  /* Put `add` in. Rebalance-at-withdrawal buys whatever is furthest below target — the mirror of
     how it sells. Waterfall never rebalances, so new money simply follows the target split. */
  function putIn(b,add){
    if(add<=0)return;
    if(isWaterfall()){for(const k in b)b[k]+=add*w(k);return;}
    const after=balTotal(b)+add, neg={};let sum=0;
    for(const k in b){const d=w(k)*after-b[k];if(d>0){neg[k]=d;sum+=d;}}
    if(sum<=0){for(const k in b)b[k]+=add*w(k);return;}
    const f=Math.min(1,add/sum);
    let placed=0;
    for(const k in neg){const put=neg[k]*f;b[k]+=put;placed+=put;}
    const rest=add-placed;
    if(rest>1e-9)for(const k in b)b[k]+=rest*w(k);}

  /* One year of market. Each asset at its own rate — equity from the record, the rest at the
     fixed rate set for it. */
  function growYear(b,st,t){
    for(const k in b){
      const r=(k==='equity')?EQ[(st+t)%NEQ]:((+S.ret[k]||0)/100);
      b[k]=Math.max(0,b[k]*(1+r));}}

  // Always returns the full year-by-year path so the same run can be drawn, not just judged.
  function runOnce(C,st,off){
    const F=retYear(),END=endYear();const OFF=off||0;
    const keys=Object.keys(CLSN);
    /* C IS EITHER AN AMOUNT OR A SET OF BALANCES, AND THE DIFFERENCE MATTERS.
       A standing start — the solved target handed over on the day — is split at the target
       weights, because that is what the figure means. But a life that saved its way here
       arrives with whatever the drift left it holding, and re-splitting that at target would be
       a free rebalance at exactly the moment the strategy says nothing rebalances. Under
       waterfall it would hand back the debt the strategy had been spending. So lifePath passes
       the balances through and they are used as they are. */
    let bal=(C&&typeof C==='object')?Object.assign({},C):splitAtTarget(C);
    let pot=balTotal(bal), dead=false, ruinYr=null; const GU=grossUp();
    const row=[pot];
    const bequestNom=S.bequest.on?S.bequest.amt*Math.pow(1+S.inflation/100,END-NOW):0;
    for(let yr=F+1;yr<=END;yr++){
      if(dead){row.push(0);continue;}
      const t=yr-F-1;
      /* THE YEAR'S MONEY COMES OUT FIRST, THEN WHAT IS LEFT GROWS.
         A retiree spends from January, not from December. Taking the year's spending out
         before the market does anything is the reading that cannot flatter the plan, and it
         is the same direction as adding contributions at the end of the saving years. */
      const spend=S.spendMo*12*Math.pow(1+S.inflation/100,yr-NOW);
      const short=takeOut(bal,(spend+goalsDueIn(yr))*GU);
      if(short>0){dead=true;ruinYr=yr;pot=0;row.push(0);continue;}
      growYear(bal,st+OFF,t);
      pot=balTotal(bal);
      if(pot<0)pot=0;
      row.push(pot);
    }
    return {ok:!dead&&pot>=bequestNom-0.0001,ruinYr,end:pot,row,bequestNom};
  }

  /* WHICH RUN IS THE WORST ONE.
     A run that runs out is worse than one that does not, and among those that run out the
     one that runs out soonest is worst. Among the survivors, the one that ends with least.
     One rule, used by the chart and by the year-by-year table, so they cannot disagree. */
  function worstIdx(ends,ruins){
    let best=0,bs=Infinity;
    for(let i=0;i<ends.length;i++){
      const sc=(ruins[i]!=null)?(-1e9+ruins[i]):(ends[i]||0);
      if(sc<bs){bs=sc;best=i;}}
    return best;}

  /* Every run redrawn from the solved number. The highest line is a per-age extreme stitched
     from different runs, so nobody travels along it — the app says so. The LOWEST line is one
     real run: the single history that goes worst. It has to be one run, because the table
     underneath is the same figures written out and a person adds up the rows. */
  function pathData(C,sip){
    const F=retYear(),END=endYear(),A0=age0(),nAcc=Math.max(0,F-NOW),nDec=END-F;
    const ages=[];for(let a=A0;a<=S.planAge;a++)ages.push(a);
    /* SAVING YEARS: the stitched lowest of the 31 saving histories, at the monthly amount
       we solved for. It lands exactly on the target, because that is what it was solved to do.
       We draw one line here, not three. In most histories you would arrive with more than the
       number — but the number is what the retirement half is built on, so that is where the
       second half starts. Said plainly behind the i. */
    const acc=[]; let accNom=null;
    if(sip!=null&&nAcc>0){
      const rows=[];for(let st=0;st<NEQ;st++)rows.push(accumRow(sip,st,S.haveNow||0));
      /* The binding saving run — the one that arrives at retirement with least. The monthly
         amount was solved so that this run lands exactly on the number, so drawing this one
         run joins the two halves at the same point a stitched minimum did, and it is a life. */
      let wa=0;for(let st=1;st<NEQ;st++)if(rows[st][nAcc]<rows[wa][nAcc])wa=st;
      accNom=rows[wa];
      for(let i=0;i<=nAcc;i++)acc.push(accNom[i]);
    }
    const runs=[];for(let st=0;st<NEQ;st++)runs.push(runOnce(C,st));
    const wi=worstIdx(runs.map(r=>r.end),runs.map(r=>r.ruinYr));
    const loNom=runs[wi].row;
    const med=[],lo=[],hi=[];
    for(let i=0;i<=nDec;i++){
      const c=runs.map(r=>(r.row[i]||0)).sort((x,y)=>x-y);
      med.push(c[Math.floor((c.length-1)/2)]);lo.push(loNom[i]||0);hi.push(c[c.length-1]);
    }
    const beqToday=S.bequest.on?runs[0].bequestNom:0;
    const ri=acc.length?nAcc:0;
    return {ages,acc,med,lo,hi,accNom,loNom,loStart:wi,beqToday,sip,retIdx:ri,s0:ri,retAge:S.retireAge,...endings(runs.map(r=>r.end),runs.map(r=>r.ruinYr),END)};
  }

  /* Either number is enough to know the path. Holdings with nothing going in is still a
     real life — the money compounds and you add nothing — and requiring both was the reason
     someone with a corpus and no monthly saving still saw the old two-part picture. */
  function lifePath(){
    const F=retYear(),A0=age0(),nAcc=Math.max(0,F-NOW);
    const ages=[];for(let a=A0;a<=S.planAge;a++)ages.push(a);
    const runs=[];
    for(let st=0;st<NEQ;st++){
      const acc=accumRow(S.saveMo||0,st,S.haveNow||0,F);
      /* The balances, not the total — see runOnce. Passing the total would rebalance for free
         at the one moment the strategy forbids it. */
      const dec=runOnce(acc.bal||acc[nAcc],st,nAcc).row;
      runs.push(acc.concat(dec.slice(1)));
    }
    const last=ages.length-1;
    const ends=runs.map(r=>r[last]);
    const ruin=runs.map(r=>{for(let i=0;i<r.length;i++)if(r[i]<=0.0001)return NOW+i;return null;});
    const wi=worstIdx(ends,ruin), loNom=runs[wi];
    const med=[],lo=[],hi=[];
    for(let i=0;i<ages.length;i++){
      const c=runs.map(r=>(r[i]||0)).sort((x,y)=>x-y);
      lo.push(loNom[i]||0);med.push(c[Math.floor((c.length-1)/2)]);hi.push(c[c.length-1]);
    }
    return {ages,acc:[],med,lo,hi,loNom,loStart:wi,beqToday:S.bequest.on?S.bequest.amt*Math.pow(1+S.inflation/100,endYear()-NOW):0,
      retIdx:nAcc,s0:0,retAge:S.retireAge,life:true,sip:S.saveMo,...endings(ends,ruin,endYear())};
  }

  /* HOW EACH LIFE ENDS.
     The engine has always known the year every failing run hits zero and thrown it away.
     "In the worst history you run out at 71" is the most useful sentence a run of histories
     can produce, and it was computed thirty-one times a render and never said. */
  function endings(endsNom,ruinYears,END){
    const e=endsNom.map(v=>Math.max(0,v)).sort((a,b)=>a-b);
    const outYears=ruinYears.filter(y=>y!=null);
    return {endLo:e[0],endMid:e[Math.floor((e.length-1)/2)],endHi:e[e.length-1],
      outN:outYears.length, outAge:outYears.length?age0()+(Math.min(...outYears)-NOW):null};}

  /* THE ENOUGH CURVE.
     At every age, the smallest corpus that survives every history from that age to the end
     of the plan. It falls as you get older, because there are fewer years left to pay for.
     Your money rises. Where the two meet is the age you can retire — the answer the app exists
     to give, readable without touching a control.
     One full solve per age, so it is computed once per plan and cached, and drawn in after
     the screen has painted. */
  let _ecKey=null,_ecVal=null;
  function enoughCurve(){
    const k=JSON.stringify(S,(kk,v)=>kk==='retireAge'?0:v)+'|ec';
    if(_ecKey===k)return _ecVal;
    const keep=S.retireAge, A0=age0(), out=[];
    for(let a=A0;a<=S.planAge;a++){
      S.retireAge=a;
      const c=(a>=S.planAge)?0:solve(survivesAll);
      out.push(c);
    }
    S.retireAge=keep;_k=null;_ek=null;
    _ecKey=k;_ecVal=out;return out;}

  const livePlan=()=>S.haveNow!=null||S.saveMo!=null;
  function chartPath(a,withCurve){
    const P=livePlan()?lifePath():pathData(a.worstNom,a.sip);
    P.target=a.worst;
    if(withCurve){const c=enoughCurve();if(c&&c.some(v=>v!=null))P.enough=c;}
    return P;}
  /* 52 solves, about half a second. The chart is up long before it lands. */
  function fillEnough(){
    const a=answer(); if(a.worst==null)return;
    setTimeout(()=>{
      const wrap=document.getElementById('c_wrap'); if(!wrap)return;
      const P=chartPath(a,true); if(!P.enough)return;
      wrap.innerHTML=buildChart(P);wireChart();fitPager();
    },30);}

  const survivesAll=C=>{for(let st=0;st<NEQ;st++)if(!runOnce(C,st).ok)return false;return true;};

  /* ACCUMULATION USES THE SAME ENGINE AS DECUMULATION.
     It used to be a textbook annuity at one blended rate. That made the target
     stress-tested and the path to it average-case: two different beliefs about how
     markets behave, on one screen, in one app. The saving figure was therefore too
     low for its own goal.
     Now the same 31 histories run forwards. Contributions are level in rupees, added
     at the end of each year, and the market does to them what it actually did. */
  /* THE SAVING YEARS. Two things changed here.
     Goals that fall due before you retire are paid out of these years, not ignored.
     A 2032 bill cannot come from a 2035 corpus — but it is still money you have to find,
     so it raises what you must save rather than vanishing from the plan.
     And the run can start from money you already have, if you told us. */
  function accumRow(sipMo,st,start,F){
    F=F||retYear();let bal=splitAtTarget(+start||0);let pot=+start||0;const row=[pot];let ok=true;
    const up=1+(+S.stepUp||0)/100, GU=grossUp();
    /* A break from work. Nothing is added in those years and the living costs come out of
       what has been saved so far. Preview only — the plan screen has no field for it, so a
       break can be tried but not saved. */
    const PB=S.pause, A0P=age0();
    for(let yr=NOW+1;yr<=F;yr++){
      const t=yr-NOW-1;
      // the contribution for this year — the first year's amount, stepped up each anniversary
      const ageThen=A0P+(yr-NOW);
      const onBreak=PB&&ageThen>=PB.from&&ageThen<=PB.to;
      const contrib=onBreak?0:sipMo*12*Math.pow(up,t);
      const living=onBreak?S.spendMo*12*Math.pow(1+S.inflation/100,yr-NOW)*GU:0;
      /* Out first, then growth, then this year's contribution at the end of the year. A goal
         falling due while you are still saving is a withdrawal like any other, so it obeys the
         same strategy — otherwise one plan would price a goal at 46 under one rule and a goal
         at 60 under another. */
      const short=takeOut(bal,goalsDueIn(yr)*GU+living);
      if(short>0)ok=false;
      growYear(bal,st,t);
      putIn(bal,contrib);
      pot=balTotal(bal);
      if(pot<0){pot=0;ok=false;}
      row.push(pot);
    }
    row.ok=ok;
    /* The composition at the end, not just the total — the retirement half continues from it. */
    row.bal=Object.assign({},bal);
    return row;}
  const accumRun=(sipMo,st,start,F)=>{const r=accumRow(sipMo,st,start,F);return r.ok?r[r.length-1]:-1;};
  const accumAll=(sip,C,start,F)=>{for(let st=0;st<NEQ;st++)if(accumRun(sip,st,start,F)<C)return false;return true;};
  const accumMedian=(sip,C,start,F)=>{let n=0;for(let st=0;st<NEQ;st++)if(accumRun(sip,st,start,F)>=C)n++;return n*2>NEQ;};
  const survivesMedian=C=>{let n=0;for(let st=0;st<NEQ;st++)if(runOnce(C,st).ok)n++;return n*2>NEQ;};

  // smallest nominal corpus at the retirement year that passes `test`
  function solve(test){
    let lo=0, hi=1;
    for(let i=0;i<80&&!test(hi);i++)hi*=2;
    if(!test(hi))return null;
    for(let i=0;i<32;i++){const mid=(lo+hi)/2; if(test(mid))hi=mid; else lo=mid;}
    return hi;
  }

  let _k=null,_v=null,_ek=null,_ev=null;
  const earliest=m=>{const k=JSON.stringify(S)+m;if(_ek===k)return _ev;_ek=k;_ev=earliestAge(m);return _ev;};
  function answer(){
    const k=JSON.stringify(S); if(k===_k)return _v;
    const F=retYear();
    const worst=solve(survivesAll), mid=solve(survivesMedian);
    /* The bill that used to sit under the answer — every rupee that leaves, added up — was
       deleted with its card, but its arithmetic stayed behind: thirty-five years of loops per
       call, displayed nowhere, and the last figures in the app still computed at today's
       prices. Dead code in the wrong frame is worse than dead code. */
    const END=endYear();
    // from zero: the level monthly saving that reaches the target, tested the same way
    // the target itself was — against every history, not against an average.
    const yrs=Math.max(0,F-NOW);
    let sip=null,sipMid=null;
    if(worst!=null&&yrs>0){
      sip=solve(x=>accumAll(x,worst,S.haveNow||0));
      sipMid=solve(x=>accumMedian(x,worst,S.haveNow||0));
    }
    /* EVERY FIGURE THIS APP SHOWS IS NOW NOMINAL — the rupees of the year it happens in, the
       number that will actually be on the statement. The engine always worked this way; the
       presentation used to divide it all back to today's prices and then had to explain, on
       every screen, that the year-by-year page did not. One frame, no translation, nothing to
       reconcile. What it costs is that a figure at 55 and a figure today are not comparable by
       eye, so anything that puts two years side by side has to name both years. */
    _k=k;_v={F,END,worstNom:worst,worst:worst,mid:mid,real:worst==null?null:worst/disc(F),
      sip,sipMid,yrs};
    return _v;
  }
  /* WHEN CAN YOU STOP.
     Only answerable if you told us what you have and what you save. Both optional.
     Later is always easier — more years of saving, fewer years to fund — so the earliest
     workable age can be found by halving the range rather than trying every year. */
  function worksAt(A,mode){
    const keep=S.retireAge;S.retireAge=A;
    const C=solve(mode==='mid'?survivesMedian:survivesAll);
    const F=retYear();let ok=C!=null;
    if(ok){
      const sm=S.saveMo||0, hv=S.haveNow||0;
      if(mode==='mid'){let n=0;for(let st=0;st<NEQ;st++)if(accumRun(sm,st,hv,F)>=C)n++;ok=n*2>NEQ;}
      else{for(let st=0;st<NEQ;st++)if(accumRun(sm,st,hv,F)<C){ok=false;break;}}
    }
    S.retireAge=keep;return ok;}
  function earliestAge(mode){
    if(S.haveNow==null&&S.saveMo==null)return null;   // we know nothing; a blank box is a zero
    const A0=age0(),top=S.planAge-1;
    if(!worksAt(top,mode))return null;
    let lo=A0,hi=top;
    while(lo<hi){const mid=Math.floor((lo+hi)/2);if(worksAt(mid,mode))hi=mid;else lo=mid+1;}
    return lo;}


  /* ===== THE CHART ===== */
  const crLabel=v=>v===0?'₹0':(v>=1?'₹'+(+v.toFixed(2))+' Cr':'₹'+(+(v*100).toFixed(v<0.1?1:0))+' L');
  let GEO=null, CHART_P=null;
  /* The drawing is measured from the box it is actually given, never from the full-bleed
     swipe area — that is what used to push the axis labels off both edges of the screen. */
  const chartW=()=>{
    const w=document.getElementById('c_wrap');
    if(w&&w.clientWidth){const cs=getComputedStyle(w);
      return Math.max(300,Math.min(720,w.clientWidth-(parseFloat(cs.paddingLeft)||0)-(parseFloat(cs.paddingRight)||0)));}
    const bd=document.getElementById('body');if(!bd)return 344;
    const cs=getComputedStyle(bd);
    return Math.max(300,Math.min(720,bd.clientWidth-(parseFloat(cs.paddingLeft)||0)-(parseFloat(cs.paddingRight)||0)));};
  const TIPHTML='';   // the legend is the readout now — see wireChart
  /* ===== THE CHART =====
     This is the tab, not an illustration on it. So it is drawn tall, it carries its own
     controls, and everything that used to sit around it — a legend row, a caption, a swipe
     hint, a whole card holding a slider — has been folded into the drawing or deleted.

     THE MONEY AXIS IS EVENLY SPACED. Ten-times spacing fitted every line at full height and
     cost the one thing a chart of compounding is for: on a log axis growth looks like a
     gentle bend, and equal distance does not mean equal rupees, so nothing on it can be
     compared by eye. Linear gives that back. A line half as high IS half the money.

     What it costs, and it is a real cost: the first years are a flat line near the floor,
     because ₹20 L against ₹190 Cr is under a pixel. That is not the chart failing — it is
     what compounding actually looks like, and it is the reason the year-by-year page exists.

     THE CEILING IS SET BY THE WORST RUN AND THE ENOUGH CURVE, NOT THE BEST RUN. The best run
     ends several times higher than anything the answer depends on, and letting it set the
     scale pushes the two lines that decide the question into the bottom tenth. So the band
     flattens against the top when the best run leaves the frame, and the frame says so. */
  function buildChart(P){
    const GLS=S.goals.map((g,i)=>({g,i})).filter(o=>o.g.on!==false)
      .map(o=>({g:o.g,i:o.i,y0:yrOf(o.g.date),y1:o.g.type==='recur'?yrOf(o.g.end||o.g.date):yrOf(o.g.date)}))
      .filter(o=>o.y1>=NOW&&o.y0<=NOW+P.ages.length-1).sort((a,b)=>a.y0-b.y0);
    /* One SVG unit is one screen pixel, so a wider column gets a bigger chart and the type
       stays 10px. PORTRAIT, AT A FIXED RATIO — the drawing keeps its shape at every width;
       only the table beside it is cut to match, so swiping moves nothing below. */
    const W=chartW(),H=Math.round(Math.max(300,Math.min(520,W*1.05)));
    const padL=16,padR=16,padT=28,padB=52;
    CHART_P=P;
    const plotH=Math.max(40,H-padT-padB);
    const A0=P.ages[0],A1=P.ages[P.ages.length-1];
    // what the scale has to hold: the worst run, the accumulation line, the enough curve
    const must=[];
    P.lo.forEach(v=>must.push(v));
    if(P.acc&&P.acc.length)P.acc.forEach(v=>must.push(v));
    if(P.enough)P.enough.forEach(v=>{if(v!=null)must.push(v);});
    if(P.target!=null)must.push(P.target);
    if(P.beqToday>0)must.push(P.beqToday);
    const bestMax=Math.max(...P.hi,0);
    /* THE SCALE HOLDS EVERYTHING, THE BEST RUN INCLUDED. Capping it at what the worst run and
       the enough curve need turned the band into a solid slab for forty years — a grey mass
       that said nothing. Letting the best run set the ceiling pushes the two lines that decide
       the question into the bottom third, where they are tighter but still legible and still
       visibly cross. A real band beats a readable one that is a lie. */
    /* THE SCALE IS SET BY THE WORST RUN AND THE ENOUGH CURVE, AND THE BEST RUN IS NOT DRAWN.
       In nominal rupees the best run ends 29 times higher than the worst run's peak — it was
       6.9x when everything was discounted to today. At that spread there is no honest linear
       frame holding both: scaled to the best run the two lines that decide the question are a
       20px smudge on the floor, and capped below it the band becomes a grey slab for 35 years.
       So the range is stated as figures — in the readout and in what you leave behind — rather
       than drawn as a shape that cannot be drawn. */
    const top=Math.max(...must,1)*1.10;
    const clipped=bestMax>top*1.005;
    const Y=v=>H-padB-(Math.max(0,Math.min(+v||0,top))/top)*plotH;
    const X=a=>padL+(a-A0)/Math.max(1,A1-A0)*(W-padL-padR);
    const dAge=i=>P.ages[(P.s0==null?P.retIdx:P.s0)+i];
    const rx=X(P.retAge);

    /* THE BAND IS THE RANGE; THE LOWEST LINE IS THE ANSWER. Best and worst are one shape
       with one solid edge, because the worst run is the only one anybody plans against. */
    let up='',dn='',loP='';
    P.lo.forEach((v,i)=>{const x=X(dAge(i)).toFixed(1);
      up+=(i?'L':'M')+x+' '+Y(P.hi[i]).toFixed(1)+' ';
      loP+=(i?'L':'M')+x+' '+Y(v).toFixed(1)+' ';});
    for(let i=P.lo.length-1;i>=0;i--)dn+='L'+X(dAge(i)).toFixed(1)+' '+Y(P.lo[i]).toFixed(1)+' ';
    /* --bandfill is tuned for a hairline band between two close lines; across a whole frame it
       disappears. The chart is the one place more than one hue is allowed, so the band takes the
       hue of the edge that defines it, at a tenth. */
    /* THE BAND IS DRAWN AND IT IS ALLOWED TO LEAVE. Y() clamps to the ceiling, so where the
       best run runs off the top the band simply meets the frame edge — a range that continues
       past the picture, which is the truth, rather than a range squeezed into a picture that
       flattens the two lines the question actually turns on. */
    /* THE BAND MUST NOT LOOK LIKE A LINE. Its upper edge is the best of the ${NEQ} sequences at
       each age — stitched from different runs, travelled by nobody. On the navy ground the best
       hue and the enough hue are both turquoise, so a stroked upper edge read as a second series
       crossing the enough curve, and a plan that never catches up looked like one that did.
       Fill only, no stroke, and the band says on the chart what it is. */
    const band=`<path d="${up}${dn}Z" fill="var(--c-best)" fill-opacity=".08"/>`;
    let accP='';P.acc.forEach((v,i)=>{accP+=(i?'L':'M')+X(P.ages[i]).toFixed(1)+' '+Y(v).toFixed(1)+' ';});
    let enP='';
    if(P.enough)P.enough.forEach((v,i)=>{if(v==null)return;enP+=(enP?'L':'M')+X(P.ages[i]).toFixed(1)+' '+Y(v).toFixed(1)+' ';});
    const lines=(P.acc.length?`<path d="${accP}" fill="none" stroke="var(--c-worst)" stroke-width="2.5"/>`:'')
      +`<path d="${loP}" fill="none" stroke="var(--c-worst)" stroke-width="2.5" stroke-linejoin="round"/>`
      +(enP?`<path d="${enP}" fill="none" stroke="var(--c-enough)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`:'');

    const axis=`<line x1="${padL}" y1="${H-padB}" x2="${W-padR}" y2="${H-padB}" stroke="var(--axis)"/>`;
    const beq=P.beqToday>0?`<line x1="${padL}" y1="${Y(P.beqToday)}" x2="${W-padR}" y2="${Y(P.beqToday)}" stroke="var(--ink2)" stroke-width="1" opacity=".45" stroke-dasharray="4 4"/>`:'';
    const marker=`<line x1="${rx}" y1="${padT}" x2="${rx}" y2="${H-padB}" stroke="var(--c-enough)" stroke-dasharray="3 4" opacity=".8"/>`;
    const MONO='IBM Plex Mono, monospace';
    const T=(x,y,an,fill,sz,wt,t,halo)=>`<text x="${x}" y="${y}" dominant-baseline="middle" text-anchor="${an}" fill="${fill}" font-size="${sz}" font-weight="${wt}" font-family="${MONO}"${halo?` paint-order="stroke" stroke="var(--screen-solid)" stroke-width="3.5" stroke-linejoin="round"`:''}>${t}</text>`;

    /* THE READOUT LIVES IN THE CHART. There is no legend row and no floating tooltip: one
       reserved line at the top that says what is under your finger, and falls back to the
       answer when nothing is. Reserved, so nothing moves when it changes. */
    /* The figure at the line you are dragging, printed where the line is. */
    const tgt=(P.target!=null)?(()=>{const lab=money(P.target);
      const w=lab.length*7.2+8, x=Math.max(padL+w/2,Math.min(W-padR-w/2,rx));
      return T(x,padT+13,'middle','var(--c-enough)',13,600,lab,1);})():'';

    /* THE LAST THING THE EYE LANDS ON, so it carries the fact that matters. When the worst run
       empties, the amount left is ₹0 and printing that is useless — the age it happened is the
       answer, so the pill moves to the year it happened and says so. */
    const endV=P.lo.length?P.lo[P.lo.length-1]:null;
    const ranOut=P.outN>0&&P.outAge!=null;
    /* A run that empties gets a dot on the floor and its age on the axis row, which is empty by
       definition. A pill there would sit exactly on top of the two lines crossing, which is the
       one part of the picture that must stay clear. */
    const outX=ranOut?X(P.outAge):0;
    const endPill=ranOut
      ? `<circle cx="${outX}" cy="${H-padB}" r="4" fill="var(--amber)" stroke="var(--screen-solid)" stroke-width="2"/>`
        +`<line x1="${outX}" y1="${H-padB-9}" x2="${outX}" y2="${H-padB}" stroke="var(--amber)" stroke-width="1.5"/>`
      : (endV!=null&&endV>=0.005)?(()=>{const lab=money(endV),w=lab.length*7.4+18;
          const ey=Math.max(padT+24,Math.min(H-padB-16,Y(endV)-20));
          return `<rect x="${W-padR-w}" y="${ey-11}" width="${w}" height="22" rx="6" fill="var(--ink)"/>`
            +T(W-padR-w/2,ey,'middle','var(--card)',12,600,lab)
            +`<circle cx="${X(A1)}" cy="${Y(endV)}" r="4" fill="var(--c-worst)" stroke="var(--screen-solid)" stroke-width="2"/>`;})():'';
    const clipNote=clipped?T(W-padR,14,'end','var(--mut)',10,400,'best run continues past '+money(top),1):'';

    /* The verdict block states a run-out age for retiring today; this one is for retiring at
       the age on the plan. Two true ages for one apparent question, so each says which. */
    const outLab=ranOut?('empties '+P.outAge+' \u00b7 retiring at '+P.retAge):'';
    const outW=outLab.length*5.6;
    let xl=T(X(A0),H-padB+14,'start','var(--mut)',10,400,A0);
    if(ranOut){const ox=Math.max(padL+outW/2,Math.min(W-padR-outW/2,outX));
      xl+=T(ox,H-padB+14,'middle','var(--amber)',10,600,outLab);
      if(X(A1)-(ox+outW/2)>14)xl+=T(X(A1),H-padB+14,'end','var(--mut)',10,400,A1);}
    else xl+=T(X(A1),H-padB+14,'end','var(--mut)',10,400,A1);

    /* Goals sit on the money, not beside it — a pin on whichever line is lower that year. */
    const lowAt=ai=>{const S0=(P.s0==null?P.retIdx:P.s0),di=ai-S0;
      if(di>=0&&di<P.lo.length)return P.lo[di];
      return (P.acc.length&&ai<P.acc.length)?P.acc[ai]:null;};
    const trackAt=ai=>{const e=(P.enough&&P.enough[ai]!=null)?P.enough[ai]:null,l=lowAt(ai);
      if(e==null)return l; if(l==null)return e; return Math.min(e,l);};
    let gm='';
    GLS.forEach(o=>{
      const c=['var(--series-1)','var(--series-2)','var(--series-3)','var(--series-4)','var(--series-5)'][o.i%5];
      const one=o.y1<=o.y0;
      for(let yr=Math.max(o.y0,NOW);yr<=Math.min(o.y1,NOW+P.ages.length-1);yr++){

        if(yv==null)continue;

               :`<circle cx="${X(A0+ai)}" cy="${Y(yv)}" r="2.6" fill="${c}" stroke="var(--screen-solid)" stroke-width="1"/>`;}});

    const ov=`<rect id="c_hit" x="${padL}" y="${padT}" width="${W-padL-padR}" height="${plotH}" fill="transparent"/>`
      +`<line id="c_cross" x1="0" y1="${padT}" x2="0" y2="${H-padB}" stroke="var(--ink2)" stroke-dasharray="2 3" opacity="0"/>`
      /* A DOT PER LINE, NOT ONE THAT MOVES BETWEEN THEM. The old single marker rode whichever
         line was lower, so it changed meaning as you dragged and the reader had no way to tell
         which one they were reading. Two dots in the two line colours, matching two rows in the
         readout below, and the mapping needs no explaining. */
      +`<circle id="c_dEn" r="4.5" fill="var(--c-enough)" stroke="var(--screen-solid)" stroke-width="2" opacity="0"/>`
      +`<circle id="c_dLo" r="4.5" fill="var(--c-worst)" stroke="var(--screen-solid)" stroke-width="2" opacity="0"/>`;

       ${NEQ} sequences at each age, stitched from different runs and travelled by nobody — but on
       the navy ground the best hue and the enough hue are both turquoise, so a reader took the top
       of the band for their own money and read a plan that never catches up as one that crosses.
       The label sits inside the band at its widest point, where there is room for it. */
    let bandLab='';

      let bi=0,bw=-1;
      for(let i=0;i<P.hi.length;i++){const w=Y(P.lo[i])-Y(P.hi[i]);if(w>bw){bw=w;bi=i;}}
      const by=Y(P.hi[bi])+14, bt='best of '+NEQ+', not one life', hw=bt.length*6.2/2+8;

  /* The pill that rides the retirement line. Positioned from the same X() the chart used, so
     it cannot drift away from the line it names. */
  function pillPos(){
    const g=GEO,box=document.getElementById('c_slbox'),pill=document.getElementById('c_pill');
    if(!g||!box||!pill)return;
    const sl=document.getElementById('sl');
    /* The strip is inset by exactly the SVG's own padding, so a finger at the far right of
       the track and the last age on the axis are the same place. */
    if(sl){sl.style.left=(100*g.padL/g.W)+'%';sl.style.right=(100*g.padR/g.W)+'%';sl.style.width='auto';}
    /* CLAMPED IN PIXELS, AGAINST ITS OWN MEASURED WIDTH. A percentage with translateX(-50%)
       hangs half the pill past the frame at either end of the axis, and the pager clips it. */
    const bw=box.clientWidth||0, pw=pill.offsetWidth||0;
    const at=g.X(S.retireAge)/g.W*bw;
    pill.style.left=(bw&&pw?Math.max(2,Math.min(bw-pw-2,at-pw/2)):at)+'px';}
  window.nudgeAge=d=>{const lo=age0(),hi=S.planAge-1;
    setAge(Math.max(lo,Math.min(hi,S.retireAge+d)));};

  /* ===== THE READOUT =====
     It used to be one 10px grey line inside the chart carrying four abbreviated figures with
     nothing tying them to the strokes they came from. Two problems, and neither was solvable
     inside the plot.

     WHY IT IS NOT A FLOATING TOOLTIP. On a phone the finger is already covering the point the
     tooltip wants to occupy, so it has to dodge the thumb and then it moves while you drag —
     a target that runs away. And four rows is about a quarter of this plot's height, over the
     part you are pointing at. Fixed, below the chart, is where the eyes are when the thumb is
     on the glass, and it costs the drawing nothing because it sits outside it.

     It is never blank: with nothing under the finger it shows the year you plan to retire. */
  const rdCell=(lab,val,col)=>`<div><div class="muted" style="font-size:var(--t-meta);letter-spacing:.06em;text-transform:uppercase">${lab}</div>
    <div class="num" style="font-size:var(--t-row);font-weight:600;line-height:var(--lh-tight);margin-top:2px;color:${col||'var(--ink)'}">${val}</div></div>`;
  let _rdI=undefined;
  function paintRead(i){
    const g=GEO; if(!g)return;
    const P=g.P, ages=P.ages, A0=ages[0];
    /* null means nothing is under the finger, so fall back to the age on the plan. */
    if(i==null)i=Math.max(0,Math.min(ages.length-1,P.retAge-A0));
    if(i===_rdI)return; _rdI=i;                    // pointermove fires far more often than the year changes
    const lab=document.getElementById('rd_age'), grid=document.getElementById('rd_grid');
    if(!lab||!grid)return;
    const yr=NOW+i, s0=(P.s0==null?P.retIdx:P.s0), j=i-s0, after=j>=0&&j<P.lo.length;
    const GU=grossUp();
    lab.textContent='AGE '+ages[i]+(i===P.retAge-A0?' · the year you retire':'');
    const cells=[];
    /* The enough curve is 52 solves and lands a moment after the screen paints. At the retirement age
       we already know the same figure from the answer itself, so the row is never a dash there. */
    const en=(P.enough&&P.enough[i]!=null)?P.enough[i]:((i===P.retAge-A0&&P.target!=null)?P.target:null);
    cells.push(rdCell('Enough to retire',en!=null?money(en):'—','var(--c-enough)'));
    /* ONE NAME FOR ONE THING. "Worst run" was used for the drawn line AND for the single
       ordering the table prints, which were different objects. The line is the floor. */
    cells.push(after?rdCell('Worst case',money(P.lo[j]),'var(--c-worst)')
      :rdCell('Corpus by then',(P.acc.length&&P.acc[i]!=null)?money(P.acc[i]):'—','var(--c-worst)'));
    /* Money moving that year. Before you retire something goes in, after it comes out — the same
       row, relabelled, because they are the same fact seen from two sides. In that year's rupees
       like everything else, and grossed up for the tax on selling, which is what really leaves. */
    if(i>P.retIdx){
      const outNom=(S.spendMo*12*Math.pow(1+S.inflation/100,yr-NOW)+goalsDueIn(yr))*GU;
      /* The goal rows below print the BILL; this row prints the SALE, which is bigger because
         selling is taxed. They are not meant to add up, so the label says which one it is. */
      cells.push(rdCell('Withdrawn, incl. tax',money(outNom)));
    }else if(i>0&&P.sip!=null){
      const inNom=P.sip*12*Math.pow(1+(+S.stepUp||0)/100,i-1);
      cells.push(rdCell('Invested that year',money(inNom)));
    }
    /* A goal only appears in the years it actually lands, in its own pin colour. */
    S.goals.forEach((gg,gi)=>{
      if(gg.on===false)return;

      cells.push(rdCell(gg.n,money(v),['var(--series-1)','var(--series-2)','var(--series-3)','var(--series-4)','var(--series-5)'][gi%5]));});
    grid.innerHTML=cells.join('');}

  function wireChart(){
    const svg=document.getElementById('c_svg'),
          cross=document.getElementById('c_cross'),
          dEn=document.getElementById('c_dEn'),dLo=document.getElementById('c_dLo');

      const ux=px/r.width*g.W;

      const X=g.X(P.ages[i]),s0=(P.s0==null?P.retIdx:P.s0),j=i-s0,after=j>=0&&j<P.lo.length;
      cross.setAttribute('x1',X);cross.setAttribute('x2',X);cross.setAttribute('opacity','.55');

  window.explainBand=()=>open(`<div class="eyebrow" style="margin-bottom:var(--s-2)">Reading the chart</div>
    <h2 class="sc" style="margin:var(--s-1) 0 var(--s-4)">A band, one line, and where they cross</h2>
    <div class="ink2 t-body">Every figure is <b>nominal</b> &mdash; the rupees of the year it happens in, the number that will really be on the statement. Nothing is discounted back to today's prices, so a figure at 76 is not comparable by eye to one at 40. Touch anywhere on the chart and the card below says what is under your finger; drag the <b>${'\u25C0'} age ${'\u25B6'}</b> pill along the bottom to retire at a different age.</div>
    <div class="card" style="margin-top:var(--s-5);padding:var(--s-5)">
      <div style="display:flex;gap:var(--s-4);margin-top:var(--s-4)"><span style="width:18px;height:3px;border-radius:2px;background:var(--c-enough);flex:0 0 auto;margin-top:9px"></span><div style="flex:1"><b>Enough to retire then</b><br/>The corpus you would need if you retired at that age. It falls because fewer years are left to fund. Where it meets the lowest line is your FI date.</div></div>
      <div style="display:flex;gap:var(--s-4);margin-top:var(--s-4)"><span style="width:18px;height:2.5px;border-radius:2px;background:var(--c-worst);flex:0 0 auto;margin-top:9px"></span><div style="flex:1"><b>The lowest line</b><br/>The single worst of the ${NEQ} runs — one real life, and the only one worth planning against. The year-by-year page is this run written out. Your corpus was sized so this line just survives, which is what enough means here.</div></div>
      <div style="display:flex;gap:var(--s-4);margin-top:var(--s-4)"><span style="width:18px;height:13px;border-radius:3px;background:var(--c-best);opacity:.22;flex:0 0 auto;margin-top:4px"></span><div style="flex:1"><b>The shaded band</b><br/>Everything between the worst of the ${NEQ} sequences and the best, at each age. Its top edge is stitched from whichever run happened to be luckiest that year, so <b>nobody travels along it</b> &mdash; it is a range, not a path, and it is drawn without a line of its own so it cannot be read as your money.<br/><br/>The best run itself is not drawn to the end: in these rupees it finishes about thirty times higher than the worst case ever reaches, and a frame that fits it flattens the two lines that answer the question. It is in the card under the chart instead, at whatever age you are touching.</div></div>
    </div>
    <div class="card" style="margin-top:var(--s-4);padding:var(--s-5)"><div class="eyebrow" style="font-size:var(--t-meta);margin-bottom:var(--s-3)">The scale is evenly spaced</div>
      <div class="ink2 t-body">A line half as high is half the money, and ₹0 is the axis itself. Nothing is compressed and no gridline is worth ten of the one below it, so two heights can be compared by eye — inside one chart, at one age.<br/><br/>What cannot be compared is two different ages, because the rupees are different sizes. ₹19 L a year at 56 and ₹1.78 Cr a year at 76 are the same standard of living.</div></div>
    <div class="card" style="margin-top:var(--s-4);padding:var(--s-5)"><div class="eyebrow" style="font-size:var(--t-meta);margin-bottom:var(--s-3);color:var(--amber)">What the worst case is, and is not</div>
      <div class="ink2 t-body">Every run replays the same ${NEQ} years in a different order, so the worst case is the worst <b>sequence</b>, not a worse market. A market permanently poorer than the record is not in this data and cannot be.<br/><br/>The full list of what this cannot see is behind the i on the verdict.</div></div>`);

  /* THE SECOND PAGE OF THE CHART.
     The same run, written out. One set of figures only: the actual rupees of that year,
     which is what you will really hand over. The same frame as the chart
     itself, so printing it twice was two answers to one question. */
  function cashTable(P,a){
    let rows='';
    const cell=(v,col)=>v<=0.004?`<td class="r" style="padding:var(--s-3) var(--s-1);color:var(--mut)">—</td>`
      :`<td class="r" style="padding:var(--s-3) var(--s-1);color:${col}">${money(v)}</td>`;
    const GU=grossUp(), PB=S.pause, A0P=age0();
    for(let i=0;i<P.ages.length;i++){
      const yr=NOW+i, after=i>=P.retIdx;
      // money lands during a year, so nothing moves on the row for today
      const put=P.life?(S.saveMo||0):(a.sip==null?null:a.sip);
      const onBreak=PB&&P.ages[i]>=PB.from&&P.ages[i]<=PB.to&&i<=P.retIdx;
      const inn=(i>=1&&i<=P.retIdx&&put!=null&&!onBreak)?put*12*Math.pow(1+(+S.stepUp||0)/100,i-1):0;
      /* Everything the pot actually loses that year, tax included — the engine grosses every
         withdrawal up, so a table that printed the amount before tax could never add up. */
      const spendNow=S.spendMo*12*Math.pow(1+S.inflation/100,yr-NOW);
      const out=(i>=1?(goalsDueIn(yr)+(i>P.retIdx?spendNow:0)+(onBreak?spendNow:0))*GU:0);
      const S0=(P.s0==null?P.retIdx:P.s0), j2=i-S0;
      /* The single worst run, in the rupees of its own year — the same run the chart's
         lowest line draws, so the two cannot disagree. */
      const left=P.loNom?((j2>=0&&j2<P.loNom.length)?P.loNom[j2]:(P.accNom?P.accNom[i]:0))

      /* THE DEAD YEARS ARE NOT DIMMED. They used to be drawn at 45% opacity, which failed
         contrast on the most important rows in the table and asked a faded grey to mean "the
         money ran out" — a reader takes faded text for "less important", which is the reverse.
         Full contrast throughout, ONE marked row on the year it happens, and an em dash after
         it: a run of ₹0 implies a balance that is being tracked, and there is nothing left to
         track. The OUT column keeps its real figures, because what you would still have had to
         withdraw is the whole point of reading this far. */
      const spent=(left<=0.0001&&i>0);
      const firstDead=spent&&(()=>{const pj=i-1-S0;
        const prev=P.loNom?((pj>=0&&pj<P.loNom.length)?P.loNom[pj]:(P.accNom?P.accNom[i-1]:0))
                          :((pj>=0&&pj<P.lo.length)?P.lo[pj]:(P.acc[i-1]||0));

        ? `<td class="r" style="padding:var(--s-3) var(--s-1);color:var(--amber);font-weight:600">runs out</td>`
        : spent

          : `<td class="r" style="padding:var(--s-3) var(--s-1)">${money(left)}</td>`;

        <td style="padding:var(--s-3) var(--s-1)">${P.ages[i]}</td>
        ${cell(inn,'var(--ink)')}${cell(out,'var(--amber)')}

    return `<div class="card" id="c_tblcard" style="padding:var(--s-1) var(--s-5);max-height:262px;overflow-y:auto;margin:0 var(--s-5)">
      <table class="ladder" style="width:100%">
        <thead><tr style="position:sticky;top:0;background:var(--card)">
          <th style="text-align:left;padding:var(--s-3) var(--s-1);font-size:var(--t-meta);color:var(--mut);letter-spacing:.1em">AGE</th>
          <th style="text-align:right;padding:var(--s-3) var(--s-1);font-size:var(--t-meta);color:var(--mut);letter-spacing:.1em">IN</th>
          <th style="text-align:right;padding:var(--s-3) var(--s-1);font-size:var(--t-meta);color:var(--mut);letter-spacing:.1em">OUT</th>
          <th style="text-align:right;padding:var(--s-3) var(--s-1);font-size:var(--t-meta);color:var(--mut);letter-spacing:.1em">CORPUS</th></tr></thead>
        <tbody>${rows}</tbody></table></div>
      <div style="margin:var(--s-4) var(--s-5) 0"><button class="btn btn--mini" style="width:100%;flex:none" onclick="exportCSV()">Download this table as CSV</button></div>
      <div class="muted" style="font-size:var(--t-body);line-height:var(--lh-ui);margin:var(--s-3) var(--s-5) 0">The worst case. Every row follows from the one above it.</div>`;}
  let CPAGE=0;
  const hideTip=()=>{
    const c=document.getElementById('c_cross');if(c)c.setAttribute('opacity','0');
    ['c_dEn','c_dLo'].forEach(id=>{const d=document.getElementById(id);if(d)d.setAttribute('opacity','0');});
    paintRead(null);};
  window.cPage=n=>{const t=document.getElementById('c_track');if(!t)return;
    hideTip();CPAGE=n;t.style.transform=`translateX(${-50*n}%)`;
    document.querySelectorAll('#c_dots .seg').forEach((d,i)=>d.classList.toggle('on',i===n));
    const lab=document.getElementById('c_plab');if(lab)lab.textContent=n?'Year by year':'Your corpus over time';
    /* The readout describes the chart, so it goes away with the chart rather than sitting under
       a table that already prints every one of its figures in full. */
    const rd=document.getElementById('c_read');if(rd)rd.style.display=n?'none':'';

  /* ONE FOOTPRINT, TWO PAGES. The chart sets the height — it is landscape and fixed — and
     the table's scroll box is cut to whatever is left after its own button and note. Both
     pages are then exactly the same height, so nothing below the pager moves when you swipe
     between them. No measuring loop and no redraw: the chart is never resized to fit. */
  function fitPager(){
    const t=document.getElementById('c_track'),pg=document.getElementById('c_pager');
    if(!t||!pg||!t.children[CPAGE])return;
    const c0=t.children[0],c1=t.children[1];
    const card=c1&&c1.querySelector('#c_tblcard');
    if(!c0||!card){pg.style.height=t.children[CPAGE].offsetHeight+'px';return;}
    card.style.maxHeight='';                       // measure its natural chrome first
    const target=c0.offsetHeight;

    card.style.maxHeight=Math.max(120,target-chrome)+'px';
    pg.style.height=target+'px';}
  /* The chart and the table are the same run seen two ways, so they are two pages of one
     thing rather than a chart and a disclosure hidden behind an i. Drag horizontally to
     turn the page; vertical drags belong to the scroll and to the table. */
  function wirePager(){
    const pg=document.getElementById('c_pager'),tr=document.getElementById('c_track');
    if(!pg||!tr)return;
    let x0=null,y0=0,dx=0,drag=false;
    /* THE SLIDER STRIP IS NOT THE PAGER'S. Both live inside #c_pager and both want horizontal
       drags, and the pager was armed first — so holding the pill and pulling sideways turned the
       page instead of moving the age, which is why it only ever behaved like a number field. A
       gesture starting inside the strip belongs to the slider, and the pager stands down. */
    pg.addEventListener('pointerdown',e=>{
      if(e.target&&e.target.closest&&e.target.closest('#c_slbox')){x0=null;return;}
      x0=e.clientX;y0=e.clientY;dx=0;drag=false;tr.style.transition='none';});

      if(drag){const w=pg.getBoundingClientRect().width||1;
        let off=-50*CPAGE+(dx/w)*50;off=Math.max(-50,Math.min(0,off));
        tr.style.transform=`translateX(${off}%)`;}});
    const done=()=>{if(x0==null)return;tr.style.transition='';
      const w=pg.getBoundingClientRect().width||1;
      let n=CPAGE;
      if(drag&&Math.abs(dx)>w*0.18)n=dx<0?Math.min(1,CPAGE+1):Math.max(0,CPAGE-1);

  /* ===== KEEPING THE PLAN =====
     It lives in this browser and nowhere else. No account, no server, no request. The
     example plan is never written down — only a plan the user has actually touched — so a
     first visit always opens on the example and a second visit opens on their own work.
     Everything here is wrapped in try/catch: some browsers and embedded viewers refuse
     storage entirely, and a planner that throws on load is worse than one that forgets. */
  /* Light or dark is a preference, not a plan, so it is kept apart from the plan file
     and survives a delete-my-plan. */
  const TKEY='wealthblueprint.theme';
  window.THEME=()=>{try{return localStorage.getItem(TKEY)||'light';}catch(e){return 'light';}};

  window.toggleTheme=()=>{const t=THEME()==='dark'?'light':'dark';
    try{localStorage.setItem(TKEY,t);}catch(e){}
    applyTheme(t);render();};
  applyTheme(THEME());

  const LSK='wealthblueprint.enough.v1';
  const KEYS=['dob','retireAge','planAge','inflation','spendMo','goals','bequest','haveNow','saveMo','stepUp','mix','ret','taxRate','taxGain','drawdown'];
  let _sv=0;
  function saveLocal(){
    if(S.sample)return;
    clearTimeout(_sv);_sv=setTimeout(()=>{
      try{const o={};KEYS.forEach(k=>o[k]=S[k]);o._v=1;localStorage.setItem(LSK,JSON.stringify(o));}catch(e){}
    },250);}
  function loadLocal(){
    try{const raw=localStorage.getItem(LSK);if(!raw)return false;
      const o=JSON.parse(raw);if(!o||typeof o!=='object')return false;
      KEYS.forEach(k=>{if(o[k]!==undefined)S[k]=o[k];});
      S.sample=false;
      GID=Math.max(0,...(S.goals||[]).map(g=>+g.id||0));
      return true;}catch(e){return false;}}

  function dl(name,text,mime){

      const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();
      setTimeout(()=>{URL.revokeObjectURL(u);a.remove();},400);}catch(e){}}
  const stamp=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
  window.exportPlan=()=>{const o={};KEYS.forEach(k=>o[k]=S[k]);o._v=1;o._app='wealth-blueprint / how much is enough';
    dl('wealth-blueprint-'+stamp()+'.json',JSON.stringify(o,null,2),'application/json');};
  window.importPlan=()=>{const i=document.createElement('input');i.type='file';i.accept='application/json,.json';
    i.onchange=()=>{const f=i.files&&i.files[0];if(!f)return;const r=new FileReader();
      r.onload=()=>{try{const o=JSON.parse(r.result);
        if(!o||typeof o!=='object')throw 0;
        KEYS.forEach(k=>{if(o[k]!==undefined)S[k]=o[k];});
        S.sample=false;GID=Math.max(0,...(S.goals||[]).map(g=>+g.id||0));
        _k=null;_gk=null;_ek=null;saveLocal();closeSheet();go('life');

      r.readAsText(f);};
